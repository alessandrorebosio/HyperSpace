name: CI

# Builds the app, runs the tests and draws every page of the settings window (light and dark,
# two window sizes) with --render-settings. The pictures are kept as the "settings-screenshots"
# artifact of the run, to look at a UI change without clicking through the app.
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcrun swift --version

      - name: Build the app
        run: make app

      - name: Test
        run: make test

      - name: Screenshots of the settings window
        run: build/HyperSpace.app/Contents/MacOS/HyperSpace --render-settings "$RUNNER_TEMP/settings"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-screenshots
          path: ${{ runner.temp }}/settings
          if-no-files-found: ignore
