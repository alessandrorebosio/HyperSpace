name: CI

# Builds the app, runs the tests and draws every page of the settings window (light and dark,
# two window sizes) with --render-settings. The pictures are kept as the "settings-screenshots"
# artifact of the run, to look at a UI change without clicking through the app.
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcrun swift --version

      - name: Build the app
        run: make app

      - name: Test
        run: make test

      # With a sample config, so the lists have rows to show.
      - name: Screenshots of the settings window
        run: |
          mkdir -p ~/.hyperspace
          cp .github/ci/sample-config.json ~/.hyperspace/config.json
          HYPERSPACE_SNAPSHOT_SCREENCAPTURE=1 build/HyperSpace.app/Contents/MacOS/HyperSpace --render-settings "$RUNNER_TEMP/settings"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-screenshots
          path: ${{ runner.temp }}/settings
          if-no-files-found: ignore

      # The same pictures on a hidden git ref (not a branch), readable with
      # `git fetch origin refs/ci/screenshots && git checkout FETCH_HEAD -- .` in an empty folder.
      - name: Publish the screenshots to refs/ci/screenshots
        if: github.event_name != 'pull_request'
        run: |
          cd "$RUNNER_TEMP/settings"
          git init -q
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Settings screenshots of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci/screenshots
