name: CI

# Builds the app, runs the tests and draws every page of the settings window (light and dark,
# two window sizes) with --render-settings. The pictures are kept as the "settings-screenshots"
# artifact of the run, to look at a UI change without clicking through the app.
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

# Read-only by default: only the job that pushes the screenshots can write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcrun swift --version

      # The README promises that the Command Line Tools are enough. Some SwiftUI features (the
      # @State macro on recent SDKs) build in Xcode but not there, so build with them too.
      - name: Build with the Command Line Tools only
        run: |
          if [ -d /Library/Developer/CommandLineTools/usr/bin ]; then
            DEVELOPER_DIR=/Library/Developer/CommandLineTools swift --version
            DEVELOPER_DIR=/Library/Developer/CommandLineTools swift build -c release --scratch-path .build-clt
          else
            # The constraint must not go unchecked without anyone noticing.
            echo "::error::No Command Line Tools on this runner: the CLT-only build cannot be checked"
            exit 1
          fi

      # The tests too: there SwiftPM needs the Swift Testing macro plugin handed to it, which
      # `make test` does. In the same scratch folder as the build above, apart from Xcode's.
      - name: Test with the Command Line Tools only
        run: DEVELOPER_DIR=/Library/Developer/CommandLineTools make test SWIFT_FLAGS="--scratch-path .build-clt"

      - name: Build the app
        run: make app

      - name: Test
        run: make test

      # With a sample config, so the lists have rows to show.
      - name: Screenshots of the settings window
        run: |
          mkdir -p ~/.config/hyperspace
          cp .github/ci/sample-config.json ~/.config/hyperspace/config.json
          HYPERSPACE_SNAPSHOT_SCREENCAPTURE=1 build/HyperSpace.app/Contents/MacOS/HyperSpace --render-settings "$RUNNER_TEMP/settings"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-screenshots
          path: ${{ runner.temp }}/settings
          if-no-files-found: ignore

  # The same pictures on a hidden git ref (not a branch), readable with
  # `git fetch origin refs/ci/screenshots && git checkout FETCH_HEAD -- .` in an empty folder.
  # A job of its own, so that only these steps hold a token that can write: it runs none of
  # the repository's code, only git on the artifact of the build job.
  publish-screenshots:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # develop and main push the same ref: one at a time, the last one to finish stays.
    concurrency:
      group: ci-screenshots
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: settings-screenshots
          path: settings

      - name: Publish the screenshots to refs/ci/screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd settings
          git init -q
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Settings screenshots of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci/screenshots
